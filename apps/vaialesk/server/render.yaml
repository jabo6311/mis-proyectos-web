# Reference blueprint: configure billing/ownership with VAI before deployment.
# Build context is apps/vaialesk; never commit .env or operational data.
services:
  - type: web
    name: vai-api-staging
    runtime: docker
    rootDir: apps/vaialesk
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPERATIONS_FILE
        value: /var/data/operations.json
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_SUPABASE_USER_IDS
        sync: false
      - key: AUDIT_SIGNING_KEY
        generateValue: true
    disk:
      name: vai-operations
      mountPath: /var/data
      sizeGB: 1
