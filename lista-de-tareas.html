<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Lista de Tareas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        /* Estilo para el campo de texto */
        #inputTarea {
            width: 35%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Estilo para el botón de agregar */
        #botonAgregar {
            padding: 10px 16px;
            font-size: 16px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #botonAgregar:hover {
            background-color: #219150;
        }

        #botonBorrarCompletadas {
            display: block;
            margin-top: 12px;
            padding: 8px 14px;
            font-size: 14px;
            background-color: #7f8c8d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #botonBorrarCompletadas:hover {
            background-color: #636e72;
        }

        #mensajeError {
            margin-top: 12px;
            min-height: 20px;
            color: #c0392b;
            font-size: 14px;
            font-weight: bold;
        }

        /* Quitamos las viñetas por defecto de la lista */
        #listaTareas {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        /* Estilo para cada tarea individual */
        #listaTareas li {
            background-color: white;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-left: 6px solid #ccc; /* color por defecto */
        }

        /* Colores según la prioridad, agregados como clase al <li> */
        .prioridad-alta {
            border-left-color: #e74c3c; /* rojo */
        }

        .prioridad-media {
            border-left-color: #f39c12; /* naranja */
        }

        .prioridad-baja {
            border-left-color: #2ecc71; /* verde */
        }

        /* Estilo para cuando una tarea está marcada como completada */
        .completada {
            text-decoration: line-through;
            color: #999;
        }

        /* Estilo para el botón de eliminar (la x) dentro de cada tarea */
        .btn-eliminar {
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Mi Lista de Tareas</h1>

    <!-- El campo de texto donde escribes la tarea -->
    <input type="text" id="inputTarea" placeholder="Escribe una tarea...">

    <!-- Menú para elegir la prioridad de la tarea -->
    <select id="selectPrioridad">
        <option value="alta">Alta</option>
        <option value="media" selected>Media</option>
        <option value="baja">Baja</option>
    </select>

    <!-- El botón que agrega la tarea a la lista -->
    <button id="botonAgregar">Agregar</button>

    <p id="mensajeError"></p>

    <!-- Aquí mostramos cuántas tareas faltan por completar -->
    <p id="contador">0 tareas pendientes</p>

    <!-- Botón para eliminar de golpe todas las tareas ya completadas -->
    <button id="botonBorrarCompletadas">Borrar completadas</button>

    <!-- Aquí van a aparecer las tareas, por ahora está vacía -->
    <ul id="listaTareas"></ul>

    <script>
        // 1. Agarramos los elementos que necesitamos controlar
        const input = document.getElementById("inputTarea");
        const selectPrioridad = document.getElementById("selectPrioridad"); // nuevo
        const boton = document.getElementById("botonAgregar");
        const lista = document.getElementById("listaTareas");
        const mensaje = document.getElementById("mensajeError");
        const contador = document.getElementById("contador");
        const botonBorrarCompletadas = document.getElementById("botonBorrarCompletadas"); // nuevo // nuevo

        function mostrarMensaje(texto) {
            mensaje.textContent = texto;
        }

        // 8. Reordena las tareas visualmente: Alta primero, luego Media, luego Baja
        function ordenarPorPrioridad() {
            // Le asignamos un "peso" numérico a cada prioridad para poder compararlas
            const peso = { alta: 1, media: 2, baja: 3 };

            // Convertimos los <li> actuales en un array normal (querySelectorAll no trae métodos como sort)
            const tareas = Array.from(lista.querySelectorAll("li"));

            // Ordenamos ese array comparando el peso de la prioridad de cada uno
            tareas.sort(function(a, b) {
                const prioridadA = a.classList.contains("prioridad-alta") ? "alta"
                                  : a.classList.contains("prioridad-baja") ? "baja" : "media";
                const prioridadB = b.classList.contains("prioridad-alta") ? "alta"
                                  : b.classList.contains("prioridad-baja") ? "baja" : "media";
                return peso[prioridadA] - peso[prioridadB];
            });

            // Volvemos a insertar cada <li> en el nuevo orden.
            // appendChild sobre un elemento que YA existe en la página lo MUEVE, no lo duplica.
            tareas.forEach(function(li) {
                lista.appendChild(li);
            });
        }

        // 7. Cuenta cuántas tareas NO están completadas y actualiza el texto
        function actualizarContador() {
            const todas = lista.querySelectorAll("li").length;
            const completadas = lista.querySelectorAll("li span.completada").length;
            const pendientes = todas - completadas;

            contador.textContent = pendientes + " tareas pendientes";
        }

        // 2. Función que agrega una nueva tarea a la lista
        // El segundo parámetro "completada" es opcional: sirve para cuando
        // recargamos tareas guardadas que ya estaban marcadas como hechas
        function agregarTarea(textoGuardado, completadaGuardada, prioridadGuardada) {
            const texto = textoGuardado !== undefined ? textoGuardado : input.value;
            const textoNormalizado = texto.trim();
            // Si viene de localStorage usamos su prioridad guardada; si no, la que eligió el usuario ahora
            const prioridad = prioridadGuardada !== undefined ? prioridadGuardada : selectPrioridad.value;

            if (textoNormalizado === "") {
                return;
            }

            if (textoGuardado === undefined) {
                const tareasExistentes = Array.from(lista.querySelectorAll("li span"));
                const yaExiste = tareasExistentes.some(function(span) {
                    return span.textContent.trim().toLowerCase() === textoNormalizado.toLowerCase();
                });

                if (yaExiste) {
                    mostrarMensaje("La tarea ya existe.");
                    input.focus();
                    return;
                }
            }

            const li = document.createElement("li");
            li.classList.add("prioridad-" + prioridad); // aplica el color según la prioridad

            const span = document.createElement("span");
            span.textContent = texto;
            if (completadaGuardada) {
                span.classList.add("completada");
            }

            span.addEventListener("click", function() {
                span.classList.toggle("completada");
                guardarTareas();
                actualizarContador();
            });

            const botonEliminar = document.createElement("button");
            botonEliminar.textContent = "X";
            botonEliminar.classList.add("btn-eliminar");

            botonEliminar.addEventListener("click", function() {
                li.remove();
                guardarTareas();
                actualizarContador();
            });

            li.appendChild(span);
            li.appendChild(botonEliminar);
            lista.appendChild(li);

            input.value = "";
            mostrarMensaje("");

            // Si vino de un clic real del usuario (no de la carga inicial), guardamos
            if (textoGuardado === undefined) {
                guardarTareas();
                input.focus();
            }

            actualizarContador();
            ordenarPorPrioridad();
        }

        // 5. Recorre todas las tareas actuales en la página y las guarda en localStorage
        function guardarTareas() {
            const tareas = [];

            lista.querySelectorAll("li").forEach(function(li) {
                const span = li.querySelector("span");
                // Buscamos cuál de las tres clases de prioridad tiene este <li>
                let prioridad = "media";
                if (li.classList.contains("prioridad-alta")) prioridad = "alta";
                if (li.classList.contains("prioridad-baja")) prioridad = "baja";

                tareas.push({
                    texto: span.textContent,
                    completada: span.classList.contains("completada"),
                    prioridad: prioridad
                });
            });

            localStorage.setItem("tareas", JSON.stringify(tareas));
        }

        // 6. Al cargar la página, revisamos si hay tareas guardadas y las mostramos
        function cargarTareas() {
            const guardadas = localStorage.getItem("tareas");

            if (guardadas) {
                const tareas = JSON.parse(guardadas);
                tareas.forEach(function(tarea) {
                    agregarTarea(tarea.texto, tarea.completada, tarea.prioridad);
                });
            }
        }

        // Ejecutamos esto apenas carga la página
        cargarTareas();

        // 3. Cuando hacen clic en "Agregar", se ejecuta la función
        boton.addEventListener("click", function() {
            agregarTarea();
        });

        // 4. Bonus: también funciona si presionas Enter dentro del campo de texto
        input.addEventListener("keypress", function(evento) {
            if (evento.key === "Enter") {
                agregarTarea();
            }
        });

        // 9. Elimina todos los <li> que tengan su span con la clase "completada"
        botonBorrarCompletadas.addEventListener("click", function() {
            lista.querySelectorAll("li").forEach(function(li) {
                const span = li.querySelector("span");
                if (span.classList.contains("completada")) {
                    li.remove();
                }
            });

            guardarTareas();
            actualizarContador();
        });
    </script>

</body>
</html>
